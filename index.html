<script>
const slides=[
['dark','Начало',`<div class="hero-meta"><span class="pill">Два продуктовых трека</span><span class="pill">Одна команда</span><span class="pill">9 месяцев</span><span class="pill">BAU_TECO</span></div><h1>ИИ-система для проектирования и экспертизы</h1><p class="lead">Контроль проектной документации до государственной экспертизы и агентное проектирование дорожных объектов</p><div class="foot"><span>Концепция · план · команда · бюджет</span><span>Октябрь 2026</span></div>`],
['','Два трека',`<div class="eyebrow">Концепция программы</div><h2>Одна платформа — два направления развития</h2><div class="branch"><div class="card blue"><div class="index">01</div><span class="tag">Трек 1</span><h3>Экспертиза и контроль</h3><p>Проверка комплектов, междокументные сверки, правила и доказательные замечания до официальной подачи.</p><button class="detailBtn" data-detail="problem">Раскрыть трек экспертизы</button></div><div class="plus">＋</div><div class="card cyan"><div class="index">02</div><span class="tag t2">Трек 2</span><h3>ИИ-агентное проектирование</h3><p>Управление исходными данными, расчётами, правилами, геометрией и выпуском части документации и чертежей.</p></div></div>`],
['','Общий фундамент',`<div class="eyebrow">Общее продуктовое ядро</div><h2>Треки используют одни данные, правила и инструменты</h2><div class="foundation"><div class="side"><div class="mini">Исходные документы</div><div class="mini">Замечания экспертизы</div><div class="mini">Нормативные требования</div></div><div class="core"><b>Информационная модель<br>+<br>инженерное ядро</b></div><div class="side"><div class="mini">Расчётные модули</div><div class="mini">Точная геометрия</div><div class="mini">Документация и CAD</div></div></div><div class="statement">Это не два независимых продукта, а два режима одной инженерной системы.</div>`],
['','Трек 1',`<span class="tag">Трек 1</span><h2>Находить ошибки до государственной экспертизы</h2><div class="grid2"><div class="card"><h3>Что делает система</h3><ul><li>проверяет комплектность и редакции;</li><li>сверяет ПЗ, ВОР, сметы, спецификации и чертежи;</li><li>контролирует требования и нормативы;</li><li>формирует доказательное замечание.</li></ul></div><div class="card blue"><h3>Первый измеримый результат</h3><ul><li>один тип дорожных объектов;</li><li>30–50 приоритетных проверок;</li><li>исторический эталон;</li><li>пилот на живом комплекте.</li></ul></div></div><button class="detailBtn" data-detail="checks">Открыть подробности, метрики и этапы</button>`],
['','Трек 2',`<span class="tag t2">Трек 2</span><h2>ИИ управляет проектированием, а не рисует результат из текста</h2><div class="compare"><div class="path"><div class="eyebrow">Рискованный путь</div><div class="pathline">ИИ → документация → чертежи</div><ul><li>высокая вероятность ошибок;</li><li>трудоёмкая перепроверка;</li><li>зависимость от модели;</li><li>нет точной геометрии.</li></ul></div><div class="path good"><div class="eyebrow">Предлагаемый путь</div><div class="pathline">ИИ-агент → расчёты → модель → выпуск</div><ul><li>расчёты выполняются кодом;</li><li>каждый шаг воспроизводим;</li><li>AI-модель можно заменить;</li><li>решение принимает проектировщик.</li></ul></div></div>`],
['','Архитектура',`<div class="eyebrow">Трек 2 · архитектура</div><h2>Агент управляет проверяемым инженерным конвейером</h2><div class="architecture"><div class="arch primary"><b>AI-агент</b><small>Понимает задачу и вызывает инструменты</small></div><div class="arch"><b>Инженерное ядро</b><small>Связывает компоненты и внешние системы</small></div><div class="arch"><b>Информационная модель</b><small>Объекты, параметры, связи и источники</small></div><div class="arch"><b>Расчётные инструменты</b><small>Существующие системы и новые модули</small></div><div class="arch"><b>Правила</b><small>Допустимость инженерных решений</small></div><div class="arch"><b>Геометрический слой</b><small>Построение точной геометрии</small></div><div class="arch"><b>Документация</b><small>Ведомости, листы и шаблоны</small></div><div class="arch"><b>CAD / PDF</b><small>Результат под контролем инженера</small></div></div>`],
['','Информационная модель',`<div class="eyebrow">Ключевая интеллектуальная собственность</div><h2>Цифровая модель дорожного объекта</h2><div class="model"><div class="root"><h3>Класс «Дорога»</h3><p>Объект разлагается на классы, параметры, связи и источники данных.</p><p class="muted">Модель развивается на реальных проектах.</p></div><div class="items">${['Трасса и ось','Горизонтальная геометрия','Продольный профиль','Поперечные профили','Земляное полотно','Дорожная одежда','Съезды и примыкания','Водоотвод','Сооружения','Организация движения','Освещение','Источники значений'].map(x=>`<span>${x}</span>`).join('')}</div></div>`],
['','Чертёжный контур',`<div class="eyebrow">Чертёжный контур</div><h2>Два варианта выпуска CAD-листов</h2><div class="grid2"><div class="card"><span class="tag">Вариант 1</span><h3>Собственный движок</h3><p>Open CASCADE / CGAL для геометрии, ezdxf для DXF, шаблоны института.</p><p><b>Плюс:</b> полный контроль.<br><b>Минус:</b> высокая сложность разработки.</p></div><div class="card cyan"><span class="tag t2">Вариант 2</span><h3>Внешняя AI-модель</h3><p>Геометрия остаётся внутри, часть формирования листа передаётся модели после обезличивания.</p><p><b>Плюс:</b> быстрый тест.<br><b>Минус:</b> юридические и санкционные риски.</p></div></div><div class="statement">На пилоте сравниваем точность, контролируемость, стоимость и возможность эксплуатации.</div>`],

const slideEls=[...document.querySelectorAll('.slide')],dossier=document.getElementById('dossier');let idx=Math.max(0,Math.min(slideEls.length-1,Number(location.hash.slice(1))-1||0)),touch=0,lastFocus;
function show(n,push=true){if(dossier.classList.contains('open'))return;n=Math.max(0,Math.min(slideEls.length-1,n));slideEls.forEach((s,i)=>{s.classList.toggle('active',i===n);s.classList.toggle('previous',i<n)});idx=n;current.textContent=String(n+1).padStart(2,'0');progress.style.width=`${(n+1)/slideEls.length*100}%`;document.title=`${slideEls[n].dataset.title} · ИИ-система`;if(push)history.replaceState(null,'',`#${n+1}`)}function topic(name){document.querySelectorAll('.topic').forEach(x=>x.classList.toggle('active',x.dataset.topic===name));document.querySelectorAll('.detail').forEach(x=>x.classList.toggle('active',x.dataset.panel===name));document.querySelector('.dbody').scrollTop=0}function openD(name='problem'){lastFocus=document.activeElement;topic(name);dossier.classList.add('open');dossier.setAttribute('aria-hidden','false');close.focus()}function closeD(){dossier.classList.remove('open');dossier.setAttribute('aria-hidden','true');lastFocus?.focus()}
prev.onclick=()=>show(idx-1);next.onclick=()=>show(idx+1);openDetails.onclick=()=>openD();close.onclick=closeD;document.querySelectorAll('.detailBtn').forEach(b=>b.onclick=()=>openD(b.dataset.detail));document.querySelectorAll('.topic').forEach(b=>b.onclick=()=>topic(b.dataset.topic));addEventListener('keydown',e=>{if(e.key==='Escape'&&dossier.classList.contains('open'))return closeD();if((e.key==='d'||e.key==='D')&&!dossier.classList.contains('open'))return openD();if(dossier.classList.contains('open'))return;if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();show(idx+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();show(idx-1)}if(e.key==='Home')show(0);if(e.key==='End')show(slideEls.length-1)});addEventListener('hashchange',()=>show(Number(location.hash.slice(1))-1||0,false));addEventListener('touchstart',e=>touch=e.changedTouches[0].clientX,{passive:true});addEventListener('touchend',e=>{if(dossier.classList.contains('open'))return;const d=e.changedTouches[0].clientX-touch;if(Math.abs(d)>55)show(idx+(d<0?1:-1))},{passive:true});total.textContent=String(slideEls.length).padStart(2,'0');show(idx,false);
